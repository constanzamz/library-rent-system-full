<div class="clients-container">
  <div class="clients-content">
    <div class="clients-header">
      <h1 class="clients-title">Clientes</h1>
    </div>

    <div class="clients-actions">
      <button mat-raised-button color="primary" (click)="newClient()">
        <mat-icon>add</mat-icon>
        Nuevo cliente
      </button>
    </div>

    <div class="form-container" *ngIf="selectedClient">
      <app-client-form
        [client]="selectedClient"
        (save)="saveClient($event)"
        (cancel)="selectedClient = null"
      >
      </app-client-form>
    </div>

    <div class="table-container" *ngIf="clients.length > 0">
      <table mat-table [dataSource]="clients" class="mat-elevation-z0">
        <ng-container matColumnDef="nombres">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let client">{{ client.nombres }}</td>
        </ng-container>

        <ng-container matColumnDef="apellidos">
          <th mat-header-cell *matHeaderCellDef>Apellido</th>
          <td mat-cell *matCellDef="let client">{{ client.apellidos }}</td>
        </ng-container>

        <ng-container matColumnDef="dni">
          <th mat-header-cell *matHeaderCellDef>DNI</th>
          <td mat-cell *matCellDef="let client">{{ client.dni }}</td>
        </ng-container>

        <ng-container matColumnDef="edad">
          <th mat-header-cell *matHeaderCellDef>Edad</th>
          <td mat-cell *matCellDef="let client">{{ client.edad }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let client" class="actions-cell">
            <button
              mat-icon-button
              color="primary"
              (click)="editClient(client)"
              matTooltip="Editar"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              (click)="deleteClient(client.id!)"
              matTooltip="Eliminar"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <div class="table-container empty-state" *ngIf="clients.length === 0">
      <p>No hay clientes registrados</p>
    </div>
  </div>
</div>
