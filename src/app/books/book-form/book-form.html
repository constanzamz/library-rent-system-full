<mat-card class="book-form-card">
  <h3 class="form-title">
    {{ book.id ? 'Editar libro' : 'Nuevo libro' }}
  </h3>

  <form (ngSubmit)="onSubmit()" class="form-content">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput [(ngModel)]="book.nombre" name="nombre" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Autor</mat-label>
      <input matInput [(ngModel)]="book.autor" name="autor" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>ISBN</mat-label>
      <input matInput [(ngModel)]="book.isbn" name="isbn" required />
    </mat-form-field>

    <div class="form-actions">
      <button mat-button type="button" (click)="cancel.emit()">
        Cancelar
      </button>
      <button mat-raised-button color="primary" type="submit">
        <mat-icon>save</mat-icon>
        Guardar
      </button>
    </div>
  </form>
</mat-card>
